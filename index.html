<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Beranda</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: '#7c3aed',
                        secondary: '#f97316',
                        darkbg: '#120828',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 text-stone-800 dark:bg-darkbg dark:text-stone-200 transition-colors duration-300">

    <!-- Loader — 3 bouncing dots -->
    <div id="loader" class="fixed inset-0 z-[100] bg-stone-50 dark:bg-darkbg flex items-center justify-center gap-3">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Hero Section — left aligned + dot grid -->
    <header class="pt-40 pb-24 relative overflow-hidden dot-grid">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="grid grid-cols-1 lg:grid-cols-[1.1fr_0.9fr] gap-10 lg:gap-12 items-center">
                <div class="max-w-2xl" data-aos="fade-right">
                    <span class="px-4 py-1.5 rounded-full bg-primary/10 text-primary text-sm font-semibold mb-6 inline-block border border-primary/20">PPG Calon Guru 2026</span>
                    <h1 class="text-4xl sm:text-6xl font-bold tracking-tight mb-6 leading-tight">
                        Selamat Datang di <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">Portofolio</span>
                    </h1>
                    <p class="text-lg text-stone-600 dark:text-stone-400 mb-10 leading-relaxed">
                        Dokumentasi perjalanan, artefak pembelajaran, dan refleksi kritis pelaksanaan Praktik Pengalaman Lapangan Terintegrasi (PPLT).
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <a href="profil.html" class="px-8 py-3.5 bg-primary hover:bg-violet-700 text-white font-medium rounded-full shadow-lg shadow-primary/25 transition text-center">Lihat Profil Saya</a>
                        <a href="artefak.html" class="px-8 py-3.5 bg-violet-100 dark:bg-violet-900/40 hover:bg-violet-200 dark:hover:bg-violet-800/60 text-violet-800 dark:text-white font-medium rounded-full transition text-center border border-violet-200 dark:border-violet-700">Eksplorasi Artefak</a>
                    </div>
                </div>

                <div class="relative flex justify-center lg:justify-end" data-aos="fade-left">
                    <div class="relative w-full max-w-md">
                        <div class="absolute -inset-4 bg-gradient-to-r from-primary/25 via-violet-300/20 to-secondary/20 blur-2xl rounded-[2rem]"></div>
                        <div class="relative overflow-hidden rounded-[2rem] border border-violet-200 dark:border-violet-700/60 shadow-[0_25px_60px_rgba(124,58,237,0.18)]">
                            <img src="potop.jpg" alt="Potret calon guru" class="w-full h-[420px] object-cover">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Decorative blob right -->
        <div class="absolute top-10 right-0 -z-10 w-[480px] h-[480px] rounded-full bg-gradient-to-br from-primary/20 to-secondary/10 blur-3xl"></div>
        <div class="absolute -bottom-10 right-1/3 -z-10 w-72 h-72 rounded-full bg-secondary/10 blur-3xl"></div>
    </header>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Back to Top -->
    <button id="backToTop"><i class="fas fa-arrow-up text-sm"></i></button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
